[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tensile_dic224"
version = "0.1.0"
description = "2D digital image correlation backend for speckle images (subset DIC + Green-Lagrange strain)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "numpy>=2.0", "scipy>=1.15", "pillow>=10", "python-multipart>=0.0.9", "uvicorn"]

[tool.setuptools.packages.find]
include = ["tensile_dic224*"]

[project.scripts]
tensile224 = "tensile_dic224.main:run"
